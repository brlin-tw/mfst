name: mfst
title: Mikaey's Flash Stress Test
summary: Flash media stress test program
description: |
  Mikaey's Flash Stress Test is a program to stress test flash media to the
  point of failure -- and possibly beyond. It detects whether a storage
  device is fake flash, speed tests the device, and stress tests it.

license: GPL-3.0-or-later
contact: mikaey@bahjeez.com
issues: https://github.com/mikaey/mfst/issues
source-code: https://github.com/mikaey/mfst
website: https://github.com/mikaey/mfst

base: core24
version: '0.4'
grade: stable
confinement: strict

apps:
  mfst:
    command: bin/mfst-wrapper.sh
    plugs:
      # Required to access raw disk block devices (e.g. /dev/sdX, /dev/mmcblkX) for stress testing
      - block-devices

      # Required for hardware introspection and querying device attributes under /sys via libudev
      - hardware-observe

      # Required to issue USBDEVFS_RESET ioctls to reset USB flash media on communication failures
      - raw-usb

      # Required for remote MySQL/MariaDB database reporting (--dbhost)
      - network

      # Required to access lock, log, or stats files located under user's home directory
      - home

      # Required to access log or stats files on removable media mount paths (/media, /run/media, /mnt)
      - removable-media

parts:
  mfst:
    source: .
    plugin: autotools
    autotools-configure-parameters:
      - --prefix=/usr
    override-build: |
      # Workaround mikaey/mfst#5
      autoreconf -fi
      craftctl default
      install -D -m 0755 snap/local/mfst-wrapper.sh "${CRAFT_PART_INSTALL}/bin/mfst-wrapper.sh"
    build-packages:
      - autoconf
      - automake
      - libtool
      - pkg-config
      - uuid-dev
      - libudev-dev
      - libjson-c-dev
      - libncurses-dev
      - libmariadb-dev
    stage-packages:
      - libudev1
      - libjson-c5
      - libmariadb3
      - libncurses6
      - libncursesw6
      - libtinfo6
      - libuuid1
